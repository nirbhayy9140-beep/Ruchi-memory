<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Little World ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #ffd6e7, #fff0f5, #e8d9ff);
      color: #4a2635;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 60px 20px;
    }

    .heart {
      font-size: 55px;
      animation: beat 1.2s infinite;
    }

    h1 {
      font-size: 42px;
      margin: 15px 0;
    }

    .subtitle {
      font-size: 20px;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .card {
      background: rgba(255,255,255,0.75);
      padding: 30px;
      margin: 25px 0;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      backdrop-filter: blur(8px);
    }

    .card h2 {
      margin-bottom: 15px;
      color: #d6336c;
    }

    .message {
      font-size: 18px;
      line-height: 1.8;
    }

    button {
      border: none;
      background: #d6336c;
      color: white;
      padding: 14px 25px;
      border-radius: 30px;
      font-size: 17px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 6px 15px rgba(214,51,108,0.3);
    }

    button:hover {
      transform: scale(1.05);
    }

    #secret {
      display: none;
      margin-top: 20px;
      font-size: 19px;
      color: #b21f55;
      line-height: 1.7;
    }

    .footer {
      margin-top: 45px;
      font-size: 16px;
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.18);
      }
    }

    .floating-heart {
      position: fixed;
      bottom: -30px;
      font-size: 22px;
      animation: float 7s linear infinite;
      opacity: 0.7;
      pointer-events: none;
    }

    @keyframes float {
      from {
        transform: translateY(0);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="heart">❤️</div>

    <h1>Welcome to Our Little World</h1>

    <p class="subtitle">
      Some memories are meant to stay forever. 🥹❤️
    </p>

    <div class="card">
      <h2>For Ruchi ❤️</h2>

      <p class="message">
        Ruchi, tum meri life ka woh

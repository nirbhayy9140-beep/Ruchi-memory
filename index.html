<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little World ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #ffd6e7, #fff0f5);
  color: #4a2635;
}

.lock {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.lock-box {
  background: white;
  padding: 30px 20px;
  border-radius: 25px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  width: 100%;
  max-width: 350px;
}

.lock-box h1 {
  color: #d6336c;
}

#display {
  font-size: 28px;
  letter-spacing: 10px;
  margin: 20px;
  min-height: 35px;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.keypad button {
  height: 60px;
  border: none;
  border-radius: 15px;
  background: #ffd6e7;
  color: #8f1748;
  font-size: 22px;
  font-weight: bold;
}

.keypad button:active {
  transform: scale(0.95);
}

.clear {
  background: #f3d7e3 !important;
}

#wrong {
  color: #d6336c;
  display: none;
}

#website {
  display: none;
}

.container {
  padding: 40px 18px;
}

h1 {
  color: #d6336c;
  font-size: 38px;
}
